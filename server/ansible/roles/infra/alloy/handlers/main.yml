# ansible/roles/infra/alloy/handlers/main.yml
- name: Reload alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: reloaded

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
    daemon_reload: true # aplica o drop-in de /etc/systemd/system/alloy.service.d
