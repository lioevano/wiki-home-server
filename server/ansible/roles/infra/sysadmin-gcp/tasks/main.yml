# ansible/roles/infra/sysadmin-gcp/tasks/main.yml
# A VM do sysadmin na GCP (página 02), configurada por ela mesma (ansible-pull do setup-sysadmin.yml, depois dos
# roles infra/docker e infra/tailscale): swap, segredos no tmpfs, firewall da rede do sysadmin, clones, plugin do
# Honcho, configurações do Hermes e do Honcho, as duas imagens locais, a stack, o painel pelo Tailscale Serve e os
# timers de atualização e de backup. Não usa o vault de casa: os segredos vêm do Secret Manager para /run/sysadmin.

# --- Memória: a e2-small tem 2 GB (gcp_tipo_maquina); as construções das imagens e o Honcho precisam de folga ---
# Swap cifrada com chave aleatória nova a cada boot (/dev/urandom): o que o kernel joga na swap, inclusive páginas
# com segredos do tmpfs /run/sysadmin, nunca fica legível no disco, nem depois de desligar. O crypttab aceita um
# arquivo comum: o gerador do systemd (systemd-cryptsetup-generator, no pacote systemd do Ubuntu 24.04) espera a
# montagem do arquivo (RequiresMountsFor), carrega o módulo loop (modprobe@loop) e o systemd-cryptsetup prende o
# arquivo a um loop device sozinho; a opção swap roda o mkswap no /dev/mapper/cryptswap a cada boot. Sem loop
# device manual nem partição nova.
- name: Swap de 4 GB
  block:
    - name: "Swap: arquivo de 4 GB"
      ansible.builtin.command: fallocate -l 4G /swapfile
      args:
        creates: /swapfile

    - name: "Swap: só o root lê"
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: '0600'

    - name: "Swap: cifrada no crypttab (chave aleatória a cada boot)"
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        line: "cryptswap /swapfile /dev/urandom swap,cipher=aes-xts-plain64,size=256"
        regexp: '^cryptswap\s'
        create: true
        owner: root
        group: root
        mode: '0644'
      register: sysadmin_crypttab

    - name: "Swap: nada de swap em claro no fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        state: absent

    - name: "Swap: a cifrada no fstab"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/dev/mapper/cryptswap none swap sw 0 0"
        regexp: '^/dev/mapper/cryptswap\s'

    - name: "Swap: vm.swappiness=10 (só quando a RAM aperta)"
      ansible.posix.sysctl:
        name: vm.swappiness
        value: '10'
        sysctl_file: /etc/sysctl.d/99-sysadmin.conf
        reload: true

    # Agora, sem esperar o próximo boot: o gerador cria as units a partir do crypttab e do fstab.
    - name: "Swap: abrir o dispositivo cifrado"
      ansible.builtin.systemd_service:
        name: systemd-cryptsetup@cryptswap.service
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: "Swap: ligar"
      ansible.builtin.systemd_service:
        name: dev-mapper-cryptswap.swap
        state: started
      when: not ansible_check_mode

# --- Segredos: o pre_tasks do playbook já rodou este arquivo (o Tailscale precisa da chave); aqui é idempotente ---
- name: Segredos do Secret Manager no tmpfs
  ansible.builtin.include_tasks: segredos.yml
  no_log: true

# Pacotes do host que os módulos usam: o community.docker fala com o Docker pelo requests; o curl é do alerta.
- name: Pacotes do host
  ansible.builtin.apt:
    name: [python3-requests, git, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Firewall: o container do sysadmin não alcança o tailnet, a casa, o metadados, o gateway nem a VM ---
- name: Firewall da rede do sysadmin
  block:
    - name: "Firewall: script (cadeia SYSADMIN na tabela raw)"
      ansible.builtin.template:
        src: firewall-sysadmin.sh.j2
        dest: /usr/local/sbin/firewall-sysadmin.sh
        owner: root
        group: root
        mode: '0750'
      register: sysadmin_fw_script

    - name: "Firewall: unit (antes do Docker)"
      ansible.builtin.template:
        src: firewall-sysadmin.service.j2
        dest: /etc/systemd/system/firewall-sysadmin.service
        owner: root
        group: root
        mode: '0644'
      register: sysadmin_fw_unit

    - name: "Firewall: habilitar e aplicar"
      ansible.builtin.systemd_service:
        name: firewall-sysadmin.service
        enabled: true
        state: "{{ 'restarted' if (sysadmin_fw_script.changed or sysadmin_fw_unit.changed) else 'started' }}"
        daemon_reload: true
      when: not ansible_check_mode

# O Docker só sobe com os segredos separados e o firewall aplicado (Requires: se um falhar, o Docker não sobe).
# Os segredos só são lidos no boot: depois de trocá-los no Secret Manager, reinicie a unit e a stack (página 02).
- name: Docker só depois das units do sysadmin
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/20-sysadmin.conf
    content: |
      [Unit]
      Requires=sysadmin-segredos.service firewall-sysadmin.service
      After=sysadmin-segredos.service firewall-sysadmin.service
    owner: root
    group: root
    mode: '0644'
  register: sysadmin_dropin

- name: Recarregar o systemd (drop-in do Docker)
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: sysadmin_dropin.changed and not ansible_check_mode

# --- Diretórios (disco da VM; os segredos nunca vêm para cá) ---
# R13: o root do host não escreve nem roda git onde um container escreve (um symlink plantado, ou hooks e
# core.fsmonitor num .git/config, virariam escrita ou execução como root no host). Ele só cria e acerta o dono do
# próprio diretório de cada container (follow: false, sem recurse). O que o root gera para o sysadmin (config.yaml,
# SOUL.md, honcho.json, plugin do Honcho) fica em config/, do root, montado só leitura no container.
# hermes (HERMES_HOME): do Hermes. saida (vault.yml cifrado que o executor entrega) e executor (known_hosts,
# pedidos): do executor. honcho-db: o entrypoint do Postgres ajusta o dono. repo e repo-executor: criados pelo clone.
- name: Diretórios do sysadmin
  ansible.builtin.file:
    path: "/opt/sysadmin{{ '/' ~ item.path if item.path else '' }}"
    state: directory
    follow: false
    owner: "{{ item.dono | default(omit) }}"
    group: "{{ item.dono | default(omit) }}"
    mode: "{{ item.modo }}"
  loop:
    - { path: "", dono: root, modo: '0755' }
    - { path: config, dono: root, modo: '0755' }
    - { path: config/plugins, dono: root, modo: '0755' }
    - { path: hermes, dono: "{{ sysadmin_uid }}", modo: '0750' }
    - { path: saida, dono: "{{ sysadmin_executor_uid }}", modo: '0755' }
    - { path: executor, dono: "{{ sysadmin_executor_uid }}", modo: '0700' }
    - { path: honcho-db, modo: '0700' }
    - { path: build, dono: root, modo: '0755' }
    - { path: stack, dono: root, modo: '0755' }

# --- Clones: o root clona só se o diretório não existe, entrega ao dono uma vez e nunca mais mexe ---
# Depois disso cada container cuida do seu: o sysadmin (branches, PRs) e o executor, que faz git pull --ff-only
# antes de cada execução. O ansible-pull usa outro clone (/opt/sysadmin/pull), só do root.
- name: "Clone de trabalho: já existe?"
  ansible.builtin.stat:
    path: /opt/sysadmin/repo
    follow: false
  register: sysadmin_repo_existe

- name: Clone de trabalho do sysadmin
  ansible.builtin.git:
    repo: "{{ sysadmin_repo_url }}"
    dest: /opt/sysadmin/repo
    update: false
  when: not sysadmin_repo_existe.stat.exists
  register: sysadmin_clone_trabalho

- name: Entregar o clone de trabalho ao Hermes
  ansible.builtin.file:
    path: /opt/sysadmin/repo
    recurse: true
    follow: false
    owner: "{{ sysadmin_uid }}"
    group: "{{ sysadmin_uid }}"
  when: sysadmin_clone_trabalho.changed

# A main: o executor lê o vault.yml.example no boot e roda os playbooks daqui. Existe antes de a stack subir.
- name: "Clone da main: já existe?"
  ansible.builtin.stat:
    path: /opt/sysadmin/repo-executor
    follow: false
  register: sysadmin_repo_executor_existe

- name: Clone da main para o executor
  ansible.builtin.git:
    repo: "{{ sysadmin_repo_url }}"
    dest: /opt/sysadmin/repo-executor
    version: main
    update: false
  when: not sysadmin_repo_executor_existe.stat.exists
  register: sysadmin_clone_executor

- name: Entregar o clone da main ao executor
  ansible.builtin.file:
    path: /opt/sysadmin/repo-executor
    recurse: true
    follow: false
    owner: "{{ sysadmin_executor_uid }}"
    group: "{{ sysadmin_executor_uid }}"
  when: sysadmin_clone_executor.changed

# --- Honcho: o plugin do Hermes sai do repositório do Honcho, na mesma tag do servidor (build/ e config/: do root) ---
- name: Plugin do Honcho
  block:
    - name: "Honcho: código na honcho_version"
      ansible.builtin.git:
        repo: "{{ sysadmin_honcho_repo }}"
        dest: /opt/sysadmin/build/honcho-src
        version: "{{ honcho_version }}"
        depth: 1
        force: true

    - name: "Honcho: plugin hermes-plugin-honcho em config/plugins/honcho (só leitura no container)"
      ansible.builtin.copy:
        src: /opt/sysadmin/build/honcho-src/hermes-plugin-honcho/
        dest: /opt/sysadmin/config/plugins/honcho/
        remote_src: true
        owner: root
        group: root
        mode: u=rwX,go=rX
        directory_mode: '0755'
      register: sysadmin_plugin

# --- Configurações do Hermes e do Honcho (do root, montadas só leitura); refeitas a cada execução ---
- name: Configurações do Hermes e do Honcho
  ansible.builtin.template:
    src: "{{ sysadmin_fonte }}/server/ansible/templates/sysadmin/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: config.yaml.j2, dest: /opt/sysadmin/config/config.yaml, servico: hermes }
    - { src: SOUL.md.j2, dest: /opt/sysadmin/config/SOUL.md, servico: hermes }
    - { src: honcho.json.j2, dest: /opt/sysadmin/config/honcho.json, servico: hermes }
    - { src: honcho-config.toml.j2, dest: /opt/sysadmin/honcho-config.toml, servico: honcho }
  loop_control:
    label: "{{ item.dest }}"
  register: sysadmin_configs

# --- Imagens locais (construídas na VM) ---
# Reconstrução: o carimbo .versoes (argumentos de build e versão da imagem) entra no contexto; contexto ou carimbo
# novo apaga o .construido; o build é forçado quando o .construido falta ou difere do .versoes, e o .construido só
# é gravado depois de um build bem-sucedido. Versão nova reconstrói, e um build que falhou é refeito na próxima.
# Memória: construir com os seis containers rodando travou a e2-small na swap do disco padrão. Antes de cada build que
# vai rodar, a stack para (o bot fica mudo durante a construção); a tarefa "Stack do sysadmin" a sobe de novo.
- name: Compose do sysadmin já instalado
  ansible.builtin.stat:
    path: /opt/sysadmin/stack/docker-compose.yml
  register: sysadmin_compose_existe

- name: Imagem do sysadmin
  block:
    - name: "Sysadmin: diretórios do contexto de build"
      ansible.builtin.file:
        path: /opt/sysadmin/build/sysadmin/wiki
        state: directory
        mode: '0755'

    # Dockerfile + o que ele copia: requirements-dev.txt, wiki/requirements.txt e as coleções (requirements.yml).
    - name: "Sysadmin: contexto de build"
      ansible.builtin.copy:
        src: "{{ sysadmin_fonte }}/{{ item.src }}"
        dest: "/opt/sysadmin/build/sysadmin/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: server/docker/images/sysadmin/, dest: "" }
        - { src: requirements-dev.txt, dest: requirements-dev.txt }
        - { src: wiki/requirements.txt, dest: wiki/requirements.txt }
        - { src: server/ansible/requirements.yml, dest: requirements.yml }
      register: sysadmin_contexto

    - name: "Sysadmin: carimbo das versões"
      ansible.builtin.copy:
        dest: /opt/sysadmin/build/sysadmin/.versoes
        content: |
          SYSADMIN_VERSION={{ sysadmin_version }}
          HERMES_VERSION={{ hermes_version }}
          ANSIBLE_CORE_VERSION={{ ops_ansible_core_version }}
          HONCHO_AI_VERSION={{ honcho_ai_version }}
        mode: '0644'
      register: sysadmin_carimbo

    - name: "Sysadmin: arquivos que saíram do repositório"
      ansible.builtin.include_tasks: contexto-limpo.yml
      vars:
        contexto_destino: /opt/sysadmin/build/sysadmin
        contexto_fontes:
          - { src: "{{ sysadmin_fonte }}/server/docker/images/sysadmin", dest: "" }
        contexto_gerados: [requirements-dev.txt, wiki/requirements.txt, requirements.yml, .versoes, .construido]

    - name: "Sysadmin: contexto novo pede build novo"
      ansible.builtin.file:
        path: /opt/sysadmin/build/sysadmin/.construido
        state: absent
      when: sysadmin_contexto.changed or sysadmin_carimbo.changed or contexto_limpeza.changed

    - name: "Sysadmin: último build bem-sucedido"
      ansible.builtin.stat:
        path: /opt/sysadmin/build/sysadmin/.construido
      register: sysadmin_construido

    - name: "Sysadmin: parar a stack para construir (memória)"
      community.docker.docker_compose_v2:
        project_src: /opt/sysadmin/stack
        state: stopped
      when: >-
        not ansible_check_mode and sysadmin_compose_existe.stat.exists
        and (not sysadmin_construido.stat.exists or sysadmin_construido.stat.checksum != sysadmin_carimbo.checksum)

    - name: "Sysadmin: construir localhost/homeserver/sysadmin"
      community.docker.docker_image:
        name: localhost/homeserver/sysadmin
        tag: "{{ sysadmin_version }}"
        source: build
        build:
          path: /opt/sysadmin/build/sysadmin
          pull: true
          args:
            HERMES_VERSION: "{{ hermes_version }}"
            ANSIBLE_CORE_VERSION: "{{ ops_ansible_core_version }}"
            HONCHO_AI_VERSION: "{{ honcho_ai_version }}"
        force_source: >-
          {{ not sysadmin_construido.stat.exists
             or sysadmin_construido.stat.checksum != sysadmin_carimbo.checksum }}

    - name: "Sysadmin: marcar o build"
      ansible.builtin.copy:
        src: /opt/sysadmin/build/sysadmin/.versoes
        dest: /opt/sysadmin/build/sysadmin/.construido
        remote_src: true
        mode: '0644'

- name: Imagem do executor
  block:
    - name: "Executor: diretório do contexto de build"
      ansible.builtin.file:
        path: /opt/sysadmin/build/executor
        state: directory
        mode: '0755'

    # Dockerfile e o pacote executor/, mais os pacotes ops e aprovador e as coleções do Ansible.
    - name: "Executor: código"
      ansible.builtin.copy:
        src: "{{ sysadmin_fonte }}/server/{{ item }}"
        dest: /opt/sysadmin/build/executor/
        mode: preserve
      loop:
        - docker/images/executor/
        - docker/images/ops/ops
        - docker/images/aprovador/aprovador
      register: sysadmin_executor_codigo

    - name: "Executor: coleções do Ansible (requirements.yml)"
      ansible.builtin.copy:
        src: "{{ sysadmin_fonte }}/server/ansible/requirements.yml"
        dest: /opt/sysadmin/build/executor/requirements.yml
        mode: '0644'
      register: sysadmin_executor_colecoes

    # fastmcp e ansible-core fixados como no ops (ops_fastmcp_version, ops_ansible_core_version).
    - name: "Executor: requirements.txt (versões do group_vars)"
      ansible.builtin.template:
        src: "{{ sysadmin_fonte }}/server/ansible/templates/agents/ops-requirements.txt.j2"
        dest: /opt/sysadmin/build/executor/requirements.txt
        mode: '0644'
      register: sysadmin_executor_requirements

    - name: "Executor: carimbo das versões"
      ansible.builtin.copy:
        dest: /opt/sysadmin/build/executor/.versoes
        content: |
          EXECUTOR_VERSION={{ executor_version }}
          FASTMCP_VERSION={{ ops_fastmcp_version }}
          ANSIBLE_CORE_VERSION={{ ops_ansible_core_version }}
          UID={{ sysadmin_executor_uid }}
          GID={{ sysadmin_executor_uid }}
        mode: '0644'
      register: sysadmin_executor_carimbo

    - name: "Executor: arquivos que saíram do repositório"
      ansible.builtin.include_tasks: contexto-limpo.yml
      vars:
        contexto_destino: /opt/sysadmin/build/executor
        contexto_fontes:
          - { src: "{{ sysadmin_fonte }}/server/docker/images/executor", dest: "" }
          - { src: "{{ sysadmin_fonte }}/server/docker/images/ops/ops", dest: ops }
          - { src: "{{ sysadmin_fonte }}/server/docker/images/aprovador/aprovador", dest: aprovador }
        contexto_gerados: [requirements.yml, requirements.txt, .versoes, .construido]

    - name: "Executor: contexto novo pede build novo"
      ansible.builtin.file:
        path: /opt/sysadmin/build/executor/.construido
        state: absent
      when: >-
        sysadmin_executor_codigo.changed or sysadmin_executor_colecoes.changed
        or sysadmin_executor_requirements.changed or sysadmin_executor_carimbo.changed
        or contexto_limpeza.changed

    - name: "Executor: último build bem-sucedido"
      ansible.builtin.stat:
        path: /opt/sysadmin/build/executor/.construido
      register: sysadmin_executor_construido

    - name: "Executor: parar a stack para construir (memória)"
      community.docker.docker_compose_v2:
        project_src: /opt/sysadmin/stack
        state: stopped
      when: >-
        not ansible_check_mode and sysadmin_compose_existe.stat.exists
        and (not sysadmin_executor_construido.stat.exists or sysadmin_executor_construido.stat.checksum != sysadmin_executor_carimbo.checksum)

    # UID/GID do build = --uid-executor do separar_segredos.py (dono dos arquivos de /run/sysadmin/executor).
    - name: "Executor: construir localhost/homeserver/executor"
      community.docker.docker_image:
        name: localhost/homeserver/executor
        tag: "{{ executor_version }}"
        source: build
        build:
          path: /opt/sysadmin/build/executor
          pull: true
          args:
            UID: "{{ sysadmin_executor_uid }}"
            GID: "{{ sysadmin_executor_uid }}"
        force_source: >-
          {{ not sysadmin_executor_construido.stat.exists
             or sysadmin_executor_construido.stat.checksum != sysadmin_executor_carimbo.checksum }}

    - name: "Executor: marcar o build"
      ansible.builtin.copy:
        src: /opt/sysadmin/build/executor/.versoes
        dest: /opt/sysadmin/build/executor/.construido
        remote_src: true
        mode: '0644'

# --- Stack ---
- name: Compose do sysadmin
  ansible.builtin.copy:
    src: "{{ sysadmin_fonte }}/server/docker/stacks/sysadmin/docker-compose.yml"
    dest: "/opt/sysadmin/stack/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

# Só valores não secretos (rotas, rede, versões, caminhos); os segredos vão por /run/sysadmin.
- name: Variáveis não secretas da stack (.env)
  ansible.builtin.template:
    src: sysadmin.env.j2
    dest: "/opt/sysadmin/stack/.env"
    owner: root
    group: root
    mode: '0644'

- name: Stack do sysadmin
  community.docker.docker_compose_v2:
    project_src: /opt/sysadmin/stack
    state: present
  when: not ansible_check_mode # no --check as imagens locais só foram simuladas

# O compose recria o que mudou de imagem ou de definição; arquivo de configuração novo pede reinício.
- name: Reiniciar o Hermes com a configuração nova
  community.docker.docker_compose_v2:
    project_src: /opt/sysadmin/stack
    services: [sysadmin, sysadmin_painel]
    state: restarted
  when: >-
    not ansible_check_mode and (sysadmin_plugin.changed
    or sysadmin_configs.results | selectattr('changed') | selectattr('item.servico', 'equalto', 'hermes') | list | length > 0)

- name: Reiniciar o Honcho com a configuração nova
  community.docker.docker_compose_v2:
    project_src: /opt/sysadmin/stack
    services: [honcho_api, honcho_deriver]
    state: restarted
  when: >-
    not ansible_check_mode
    and sysadmin_configs.results | selectattr('changed') | selectattr('item.servico', 'equalto', 'honcho') | list | length > 0

# --- Painel do Hermes: só no tailnet (HTTPS do Tailscale Serve), nunca pela internet ---
- name: "Tailscale Serve: estado"
  ansible.builtin.command: tailscale serve status --json
  register: sysadmin_serve
  changed_when: false
  failed_when: false
  check_mode: false # só lê

# Sem HTTPS ligado no tailnet o tailscale serve espera pela habilitação: o timeout e o ignore_errors deixam os timers
# abaixo serem instalados mesmo assim (o erro fica no log; ligue o HTTPS no painel do Tailscale e rode de novo).
- name: Painel pelo Tailscale Serve
  ansible.builtin.command: timeout 120 tailscale serve --bg --https=443 http://127.0.0.1:9119
  when: "'http://127.0.0.1:9119' not in sysadmin_serve.stdout"
  changed_when: true
  ignore_errors: true # noqa: ignore-errors

# --- Timers (em UTC) ---
# Aviso de falha: o backup e o ansible-pull rodam sozinhos; OnFailure= chama esta unit, que avisa no Telegram.
- name: Aviso de falha das units
  block:
    - name: "Aviso: scripts do alerta e do ansible-core"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: '0750'
      loop: [sysadmin-alerta.sh, sysadmin-ansible-core.sh]

    - name: "Aviso: unit sysadmin-alerta@"
      ansible.builtin.template:
        src: sysadmin-alerta.service.j2
        dest: /etc/systemd/system/sysadmin-alerta@.service
        owner: root
        group: root
        mode: '0644'

- name: Atualização diária (ansible-pull)
  block:
    - name: "ansible-pull: service e timer"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [sysadmin-pull.service, sysadmin-pull.timer]

    - name: "ansible-pull: habilitar o timer"
      ansible.builtin.systemd_service:
        name: sysadmin-pull.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

- name: Backup diário no GCS
  block:
    - name: "Backup: script"
      ansible.builtin.template:
        src: sysadmin-backup.sh.j2
        dest: /usr/local/sbin/sysadmin-backup.sh
        owner: root
        group: root
        mode: '0750'

    - name: "Backup: service e timer"
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [sysadmin-backup.service, sysadmin-backup.timer]

    - name: "Backup: habilitar o timer"
      ansible.builtin.systemd_service:
        name: sysadmin-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
