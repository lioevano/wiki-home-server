# ansible/roles/apps/ml-tools/tasks/main.yml
# Este role é para a VM ai-desktop-vm (GPU AMD RX 5600 XT passada pelo Proxmox).
# O Ollama usa a GPU por Vulkan (Mesa RADV) dentro do container; não há driver de GPU a instalar na VM
# além do amdgpu do kernel. Este role constrói a imagem local do Ollama com o RADV e libera /dev/dri.

- name: "Adicionar usuários aos grupos 'render' e 'video' para acesso à GPU"
  ansible.builtin.user:
    name: "{{ item }}"
    groups: render,video
    append: yes
  loop:
    - "{{ vm_ansible_user_name }}"
    - "{{ docker_user_name_on_vm }}"

- name: "Criar diretório de build da imagem do Ollama com Vulkan"
  ansible.builtin.file:
    path: /opt/ollama-vulkan
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Gerar o Dockerfile da imagem do Ollama com Vulkan"
  ansible.builtin.template:
    src: Dockerfile.ollama-vulkan.j2
    dest: /opt/ollama-vulkan/Dockerfile
    owner: root
    group: root
    mode: '0644'

- name: "Construir a imagem local do Ollama com Vulkan (homeserver/ollama-vulkan)"
  community.docker.docker_image:
    name: homeserver/ollama-vulkan
    tag: "{{ ollama_version }}"
    source: build
    build:
      path: /opt/ollama-vulkan
      pull: true
    force_source: false # reconstrói só quando ollama_version muda (tag nova)

# Migração: se uma instalação nativa antiga existir, ela é desativada para liberar a porta 11434.
- name: "Verificar instalação nativa antiga do Ollama"
  ansible.builtin.stat:
    path: /etc/systemd/system/ollama.service
  register: ollama_native_unit

- name: "Desativar Ollama nativo (substituído pelo container da stack ai)"
  ansible.builtin.systemd_service:
    name: ollama
    state: stopped
    enabled: false
  when: ollama_native_unit.stat.exists
