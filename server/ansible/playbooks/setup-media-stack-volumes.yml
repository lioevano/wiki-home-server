# ansible/playbooks/setup-media-stack-volumes.yml
- name: Setup Media Stack Volumes and Environment
  hosts: core_services
  become: true
  gather_facts: true
  vars_files:
    - ../inventories/home/group_vars/all/main.yml
    - ../inventories/home/group_vars/all/vault.yml

  tasks:
    - name: Garantir diretório de envs do Portainer
      ansible.builtin.file:
        path: "{{ portainer_env_files_dest_path_on_vm }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Criar diretórios de configuração das aplicações de mídia no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/{{ item }}/config"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'
      loop:
        - jellyfin
        - seerr
        - sonarr
        - radarr
        - lidarr
        - prowlarr
        - bazarr
        - gluetun
        - qbittorrent
        - recyclarr

    # Layout TRaSH: torrents/ e media/ no MESMO dataset, para importar por hardlink.
    - name: Criar a árvore /data (torrents e biblioteca) no dataset de mídia
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_media_dataset_name }}/{{ item }}"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'
      loop:
        - torrents/movies
        - torrents/tv
        - torrents/music
        - media/movies
        - media/tv
        - media/music

    - name: Gerar a configuração do Recyclarr (contém as chaves de API)
      ansible.builtin.template:
        src: ../templates/recyclarr.yml.j2
        dest: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/recyclarr/config/recyclarr.yml"
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0600'

    - name: Generate .env file for media stack
      ansible.builtin.template:
        src: ../templates/portainer_stack_env.j2
        dest: "{{ portainer_env_files_dest_path_on_vm }}/media.env"
        owner: root
        group: root
        mode: '0600' # contém chaves de API e a chave da VPN
      vars:
        stack_name: media
        stack_configs:
          - { name: 'MEDIA_STACK_DATA_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_media_dataset_name }}" }
          - { name: 'MEDIA_STACK_JELLYFIN_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/jellyfin/config" }
          - { name: 'MEDIA_STACK_SEERR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/seerr/config" }
          - { name: 'MEDIA_STACK_SONARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/sonarr/config" }
          - { name: 'MEDIA_STACK_RADARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/radarr/config" }
          - { name: 'MEDIA_STACK_LIDARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/lidarr/config" }
          - { name: 'MEDIA_STACK_PROWLARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/prowlarr/config" }
          - { name: 'MEDIA_STACK_BAZARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/bazarr/config" }
          - { name: 'MEDIA_STACK_GLUETUN_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/gluetun/config" }
          - { name: 'MEDIA_STACK_QBITTORRENT_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/qbittorrent/config" }
          - { name: 'MEDIA_STACK_RECYCLARR_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/recyclarr/config" }
          - { name: 'SONARR_API_KEY', value: "{{ arr_api_keys.sonarr }}" }
          - { name: 'RADARR_API_KEY', value: "{{ arr_api_keys.radarr }}" }
          - { name: 'LIDARR_API_KEY', value: "{{ arr_api_keys.lidarr }}" }
          - { name: 'PROWLARR_API_KEY', value: "{{ arr_api_keys.prowlarr }}" }
          - { name: 'PROTONVPN_WIREGUARD_PRIVATE_KEY', value: "{{ protonvpn_wireguard_private_key }}" }
