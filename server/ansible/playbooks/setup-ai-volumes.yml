# ansible/playbooks/setup-ai-volumes.yml
# Volumes, configs e ai.env da stack de IA (LiteLLM + Postgres, Ollama com Vulkan, Open WebUI, Diun). Página 08.
- name: Preparar volumes e configuração da Stack de IA
  hosts: ai_desktop
  become: true
  gather_facts: true
  vars_files:
    - ../inventories/home/group_vars/all/main.yml
    - ../inventories/home/group_vars/all/vault.yml

  roles:
    - role: ../roles/apps/ml-tools

  tasks:
    # --- LiteLLM ---
    - name: Criar diretório do LiteLLM no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/litellm/config"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    - name: Gerar config.yaml do LiteLLM
      ansible.builtin.template:
        src: ../templates/litellm_config.yaml.j2
        dest: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/litellm/config/config.yaml"
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0644'

    # Banco do LiteLLM no disco local (Postgres não vai para NFS); backup = dump diário no NFS.
    - name: Criar diretório local do banco do LiteLLM
      ansible.builtin.file:
        path: "{{ vm_local_data_path }}/litellm-db"
        state: directory
        mode: '0700' # sem owner: o entrypoint do Postgres assume o diretório

    # Dump diário do banco do LiteLLM (chaves, orçamentos e histórico de uso) para o NFS.
    - name: Criar diretório dos dumps do LiteLLM no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/litellm/db-dumps"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    - name: Instalar o script de dump do banco do LiteLLM
      ansible.builtin.template:
        src: ../templates/backup-postgres.sh.j2
        dest: /usr/local/sbin/backup-litellm-db.sh
        owner: root
        group: root
        mode: '0750'
      vars:
        backup_container: litellm_db
        backup_db: litellm
        backup_user: litellm
        backup_dest: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/litellm/db-dumps"
        backup_prefix: litellm

    - name: Instalar o serviço systemd do dump do LiteLLM
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-litellm-db.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Dump diário do Postgres do LiteLLM (página 08)
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/backup-litellm-db.sh

    - name: Instalar o timer systemd do dump do LiteLLM
      ansible.builtin.copy:
        dest: /etc/systemd/system/backup-litellm-db.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Agenda o dump diário do Postgres do LiteLLM

          [Timer]
          OnCalendar=*-*-* 03:45:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Habilitar o timer do dump do LiteLLM
      ansible.builtin.systemd:
        name: backup-litellm-db.timer
        enabled: true
        state: started
        daemon_reload: true

    # --- Ollama ---
    - name: Criar diretório dos modelos Ollama no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/ollama/models"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    # --- Open WebUI ---
    - name: Criar diretório do Open WebUI no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/openwebui/data"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    # --- Diun da VM de IA (atualizações de imagens, integração notificacoes) ---
    - name: Criar diretório de dados do Diun da VM de IA no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/diun-ai/data"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    # GID do grupo render da VM, que o container do Ollama precisa para abrir /dev/dri/renderD*.
    - name: Ler o GID do grupo render
      ansible.builtin.getent:
        database: group
        key: render

    # --- .env para Portainer ---
    - name: Garantir diretório de envs do Portainer
      ansible.builtin.file:
        path: "{{ portainer_env_files_dest_path_on_vm }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Gerar ai.env para Portainer
      ansible.builtin.template:
        src: ../templates/portainer_stack_env.j2
        dest: "{{ portainer_env_files_dest_path_on_vm }}/ai.env"
        owner: root
        group: root
        mode: '0600'
      vars:
        stack_name: ai
        stack_configs:
          - { name: 'AI_DESKTOP_VM_IP', value: "{{ ai_desktop_vm_ip_var }}" }
          - { name: 'AI_STACK_LITELLM_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/litellm/config" }
          - { name: 'AI_STACK_LITELLM_DB_PATH', value: "{{ vm_local_data_path }}/litellm-db" }
          - { name: 'AI_STACK_OLLAMA_MODELS_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/ollama/models" }
          - { name: 'AI_STACK_OPENWEBUI_DATA_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/openwebui/data" }
          - { name: 'AI_STACK_DIUN_DATA_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/diun-ai/data" }
          - { name: 'AI_RENDER_GID', value: "{{ ansible_facts.getent_group.render[1] }}" }
          - { name: 'OLLAMA_IMAGE', value: "localhost/homeserver/ollama-vulkan:{{ ollama_version }}" }
          - { name: 'LITELLM_MASTER_KEY', value: "{{ litellm_master_key }}" }
          - { name: 'LITELLM_DB_PASSWORD', value: "{{ litellm_db_password }}" }
          - { name: 'ANTHROPIC_API_KEY', value: "{{ llm_api_keys.anthropic }}" }
          - { name: 'OPENAI_API_KEY', value: "{{ llm_api_keys.openai }}" }
          - { name: 'GEMINI_API_KEY', value: "{{ llm_api_keys.google_gemini }}" }
          - { name: 'TYPESAFE_API_KEY', value: "{{ llm_api_keys.typesafe }}" }
          - { name: 'LITELLM_KEY_OPENWEBUI', value: "{{ litellm_client_keys.openwebui }}" }
          - { name: 'OPENWEBUI_SECRET_KEY', value: "{{ openwebui_secret_key }}" }
          - { name: 'OPENWEBUI_OAUTH_CLIENT_SECRET', value: "{{ oidc_clients.openwebui.secret }}" }
          - { name: 'OPENWEBUI_LOGIN_FORM', value: "{{ openwebui_login_form | bool | lower }}" }
          - { name: 'NOTIFICACOES_WEBHOOK_TOKEN', value: "{{ notificacoes_webhook_token }}" }
