# ansible/playbooks/setup-productivity-automation-volumes.yml
- name: Setup Productivity & Automation Stack Volumes and Environment
  hosts: core_services
  become: true
  gather_facts: true
  vars_files:
    - ../inventories/home/group_vars/all/main.yml
    - ../inventories/home/group_vars/all/vault.yml

  tasks:
    - name: Garantir diretório de envs do Portainer
      ansible.builtin.file:
        path: "{{ portainer_env_files_dest_path_on_vm }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # --- Nextcloud directories ---
    - name: Create Nextcloud config directories on NFS volume
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/nextcloud/{{ item }}"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'
      loop:
        - html
        - data
        - config
        - db_pg

    # --- Home Assistant directory ---
    - name: Create Home Assistant config directory on NFS volume
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/homeassistant/config"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    # --- .env files ---
    - name: Generate .env file for productivity stack (Nextcloud)
      ansible.builtin.template:
        src: ../templates/portainer_stack_env.j2
        dest: "{{ portainer_env_files_dest_path_on_vm }}/productivity.env"
        owner: root
        group: root
        mode: '0644'
      vars:
        stack_name: productivity
        stack_configs:
          - { name: 'PROD_STACK_NEXTCLOUD_DB_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/nextcloud/db_pg" }
          - { name: 'PROD_STACK_NEXTCLOUD_HTML_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/nextcloud/html" }
          - { name: 'PROD_STACK_NEXTCLOUD_DATA_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/nextcloud/data" }
          - { name: 'PROD_STACK_NEXTCLOUD_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/nextcloud/config" }

    - name: Generate .env file for automation stack (Home Assistant)
      ansible.builtin.template:
        src: ../templates/portainer_stack_env.j2
        dest: "{{ portainer_env_files_dest_path_on_vm }}/automation.env"
        owner: root
        group: root
        mode: '0644'
      vars:
        stack_name: automation
        stack_configs:
          - { name: 'AUTO_STACK_HOMEASSISTANT_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/homeassistant/config" }
