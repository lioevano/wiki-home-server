# ansible/playbooks/setup-photos-stack-volumes.yml
# Prepara a stack photos (Immich): diretórios, immich.json e photos.env (página 11).
- name: Setup Photos Stack Volumes and Environment
  hosts: core_services
  become: true
  gather_facts: true
  vars_files:
    - ../inventories/home/group_vars/all/main.yml
    - ../inventories/home/group_vars/all/vault.yml

  tasks:
    - name: Garantir diretório de envs do Portainer
      ansible.builtin.file:
        path: "{{ portainer_env_files_dest_path_on_vm }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Criar diretório de configuração do Immich no NFS
      ansible.builtin.file:
        path: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/immich/config"
        state: directory
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0775'

    # Disco local: o Postgres do Immich não pode ficar em NFS; o cache de modelos é descartável.
    - name: Criar diretórios locais do Immich (banco e cache de modelos)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700' # sem owner: o entrypoint de cada imagem assume o diretório
      loop:
        - "{{ vm_local_data_path }}/immich-db"
        - "{{ vm_local_data_path }}/immich-model-cache"

    - name: Gerar a configuração do Immich (contém o segredo do cliente OIDC)
      ansible.builtin.template:
        src: ../templates/immich/immich.json.j2
        dest: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/immich/config/immich.json"
        owner: "{{ docker_puid }}"
        group: "{{ docker_pgid }}"
        mode: '0600'

    - name: Generate .env file for photos stack
      ansible.builtin.template:
        src: ../templates/portainer_stack_env.j2
        dest: "{{ portainer_env_files_dest_path_on_vm }}/photos.env"
        owner: root
        group: root
        mode: '0600' # contém a senha do banco
      vars:
        stack_name: photos
        stack_configs:
          - { name: 'IMMICH_VERSION', value: "{{ immich_version }}" }
          - { name: 'PHOTOS_STACK_UPLOAD_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_photos_dataset_name }}" }
          - { name: 'PHOTOS_STACK_CONFIG_PATH', value: "{{ vm_nfs_mount_base_path }}/{{ zfs_docker_volumes_dataset_name }}/immich/config" }
          - { name: 'PHOTOS_STACK_DB_PATH', value: "{{ vm_local_data_path }}/immich-db" }
          - { name: 'PHOTOS_STACK_MODEL_CACHE_PATH', value: "{{ vm_local_data_path }}/immich-model-cache" }
          - { name: 'IMMICH_DB_PASSWORD', value: "{{ immich_db_password }}" }
          - { name: 'CORE_SERVICES_VM_IP_VAR', value: "{{ core_services_vm_ip_var }}" }
