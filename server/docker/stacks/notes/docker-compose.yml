# docker/stacks/notes/docker-compose.yml
# Segundo cérebro: Syncthing (vaults do Obsidian), qmd (busca local), MCP de escrita só em Trabalho e Estudos e
# os mcp-auth-proxy que publicam os dois MCPs com login pelo Authelia. Roda na ai-desktop-vm.
# O escopo de cada serviço é dado pelas montagens: o que não está montado não existe para ele.
# Variáveis: /opt/portainer_stack_envs/notes.env, gerado por ansible/playbooks/setup-notes-volumes.yml.
# Página: 01-manual-implementacao/12-segundo-cerebro.md
version: '3.9'

networks:
  notes_network:
    name: notes_network
    driver: bridge
  # MCPs sem autenticação própria: só nesta rede (os proxies e o Open WebUI se juntam a ela).
  notes_mcp:
    name: notes_mcp
    driver: bridge

services:
  # Nó do servidor no Syncthing: sempre ligado, pareado com o PC e o celular. Único serviço que escreve no Pessoal.
  # Configuração e chaves no NFS; banco interno no disco local (regerável por uma varredura).
  syncthing:
    image: docker.io/syncthing/syncthing:2.1.6 # = syncthing_version (group_vars), usada também no 'generate'
    container_name: syncthing
    restart: unless-stopped
    networks:
      - notes_network
    ports:
      - "${AI_DESKTOP_VM_IP}:8384:8384" # painel (Traefik: sync.; tem usuário e senha)
      - "${AI_DESKTOP_VM_IP}:22000:22000/tcp" # sincronização
      - "${AI_DESKTOP_VM_IP}:22000:22000/udp"
    volumes:
      - "${NOTES_STACK_DATA_PATH}:/var/syncthing/notes"
      - "${NOTES_STACK_SYNCTHING_CONFIG_PATH}:/var/syncthing/config"
      - "${NOTES_STACK_SYNCTHING_DB_PATH}:/var/syncthing/data"
    environment:
      - TZ=${SYSTEM_TIMEZONE}
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - STHOMEDIR= # a imagem define STHOMEDIR; vazio para usar config e dados separados
      - STCONFDIR=/var/syncthing/config
      - STDATADIR=/var/syncthing/data
      - STGUIAPIKEY=${SYNCTHING_API_KEY}
      - STNOUPGRADE=1 # versão fixada; atualização pela imagem
    healthcheck:
      test: ["CMD-SHELL", "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o OK || exit 1"]
      interval: 1m
      timeout: 10s

  # Busca local (BM25 + vetorial + reordenação) sobre os vaults e os documentos do Nextcloud. Tudo :ro.
  qmd:
    image: ${QMD_IMAGE}
    pull_policy: never # imagem construída na VM (localhost/...); nunca buscar em registro
    container_name: qmd
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    labels:
      diun.enable: "false" # imagem local: o Diun não tem onde procurar versão nova
    networks:
      - notes_network
      - notes_mcp
    command: ["qmd", "mcp", "--http", "--host", "0.0.0.0", "--port", "8181"]
    volumes:
      - "${NOTES_STACK_DATA_PATH}/pessoal:/notes/pessoal:ro"
      - "${NOTES_STACK_DATA_PATH}/trabalho:/notes/trabalho:ro"
      - "${NOTES_STACK_DATA_PATH}/estudos:/notes/estudos:ro"
      - "${NOTES_STACK_DOCUMENTOS_PATH}:/notes/documentos:ro"
      - "${NOTES_STACK_QMD_CONFIG_PATH}:/config"
      - "${NOTES_STACK_QMD_CACHE_PATH}:/cache"
    devices:
      - /dev/dri
    group_add:
      - "${AI_RENDER_GID}" # grupo render da VM (acesso a /dev/dri/renderD*)
    environment:
      - TZ=${SYSTEM_TIMEZONE}
      - HOME=/cache
      - QMD_CONFIG_DIR=/config
      - XDG_CACHE_HOME=/cache
      # Host aceitos: o nome interno (Open WebUI, agentes) e o público, que o mcp-auth-proxy repassa.
      - QMD_ALLOWED_HOSTS=qmd,qmd:8181,notas.${BASE_DOMAIN_FROM_VAULT}

  # MCP de escrita: server-filesystem (stdio) servido em Streamable HTTP pelo supergateway. Só Trabalho e Estudos.
  notes_escrita:
    image: ${NOTES_ESCRITA_IMAGE}
    pull_policy: never
    container_name: notes_escrita
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    labels:
      diun.enable: "false"
    networks:
      - notes_mcp
    command: ["supergateway", "--stdio", "mcp-server-filesystem /notes/trabalho /notes/estudos",
              "--outputTransport", "streamableHttp", "--stateful", "--sessionTimeout", "600000",
              "--port", "8000", "--healthEndpoint", "/healthz"]
    volumes:
      - "${NOTES_STACK_DATA_PATH}/trabalho:/notes/trabalho"
      - "${NOTES_STACK_DATA_PATH}/estudos:/notes/estudos"
    environment:
      - TZ=${SYSTEM_TIMEZONE}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1m
      timeout: 10s

  # Conector notas. (busca em todos os vaults e documentos): OAuth 2.1 com registro dinâmico (exigido pelo claude.ai), login delegado ao
  # OIDC do Authelia (cliente 'mcp', 2FA) e só para o grupo admins. Traefik: notas. → porta 8481.
  mcp_auth_busca:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2 # = mcp_auth_proxy_version (group_vars)
    container_name: mcp_auth_busca
    restart: unless-stopped
    networks:
      - notes_mcp
    ports:
      - "${AI_DESKTOP_VM_IP}:8481:80"
    command: ["http://qmd:8181/mcp"]
    volumes:
      - "${NOTES_STACK_MCP_AUTH_BUSCA_PATH}:/data" # estado OAuth (regerável: perder = novo login)
    environment:
      - TZ=${SYSTEM_TIMEZONE}
      - EXTERNAL_URL=https://notas.${BASE_DOMAIN_FROM_VAULT}
      - NO_AUTO_TLS=true # o TLS fica no Traefik
      - LISTEN=:80
      - DATA_PATH=/data
      - OIDC_CONFIGURATION_URL=https://auth.${BASE_DOMAIN_FROM_VAULT}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=mcp
      - OIDC_CLIENT_SECRET=${MCP_OIDC_CLIENT_SECRET}
      - OIDC_SCOPES=openid,profile,email,groups
      - OIDC_ALLOWED_ATTRIBUTES=/groups=admins
      - OIDC_PROVIDER_NAME=Authelia
      - AUTH_HMAC_SECRET=${MCP_AUTH_HMAC_SECRET}
      - TRUSTED_PROXIES=${CORE_SERVICES_VM_IP} # Traefik

  # Conector escrita. (escrita em Trabalho e Estudos): OAuth 2.1 com registro dinâmico (exigido pelo claude.ai), login delegado ao
  # OIDC do Authelia (cliente 'mcp', 2FA) e só para o grupo admins. Traefik: escrita. → porta 8482.
  mcp_auth_escrita:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2 # = mcp_auth_proxy_version (group_vars)
    container_name: mcp_auth_escrita
    restart: unless-stopped
    networks:
      - notes_mcp
    ports:
      - "${AI_DESKTOP_VM_IP}:8482:80"
    command: ["http://notes_escrita:8000/mcp"]
    volumes:
      - "${NOTES_STACK_MCP_AUTH_ESCRITA_PATH}:/data" # estado OAuth (regerável: perder = novo login)
    environment:
      - TZ=${SYSTEM_TIMEZONE}
      - EXTERNAL_URL=https://escrita.${BASE_DOMAIN_FROM_VAULT}
      - NO_AUTO_TLS=true # o TLS fica no Traefik
      - LISTEN=:80
      - DATA_PATH=/data
      - OIDC_CONFIGURATION_URL=https://auth.${BASE_DOMAIN_FROM_VAULT}/.well-known/openid-configuration
      - OIDC_CLIENT_ID=mcp
      - OIDC_CLIENT_SECRET=${MCP_OIDC_CLIENT_SECRET}
      - OIDC_SCOPES=openid,profile,email,groups
      - OIDC_ALLOWED_ATTRIBUTES=/groups=admins
      - OIDC_PROVIDER_NAME=Authelia
      - AUTH_HMAC_SECRET=${MCP_AUTH_HMAC_SECRET}
      - TRUSTED_PROXIES=${CORE_SERVICES_VM_IP} # Traefik
