# docker/stacks/photos/docker-compose.yml
# Stack de fotos: Immich (servidor, aprendizado de máquina na CPU, Valkey e Postgres com extensão vetorial).
# Variáveis: /opt/portainer_stack_envs/photos.env, gerado por ansible/playbooks/setup-photos-stack-volumes.yml.
# Imagens de immich_redis e immich_db copiadas do docker-compose.yml oficial da release em IMMICH_VERSION
# (https://github.com/immich-app/immich/releases): ao atualizar o Immich, confira e copie de novo.
# Página: 01-manual-implementacao/11-fotos-arquivos.md

services:
  immich_server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    restart: unless-stopped
    networks:
      - proxy
      - internal_services
    volumes:
      - "${PHOTOS_STACK_UPLOAD_PATH}:/data" # dataset photos (NFS): uploads, miniaturas, vídeos convertidos e dumps do banco
      - "${PHOTOS_STACK_CONFIG_PATH}:/config:ro" # immich.json gerado pelo Ansible
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      IMMICH_CONFIG_FILE: /config/immich.json
      DB_HOSTNAME: immich_db
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      REDIS_HOSTNAME: immich_redis
      TZ: ${SYSTEM_TIMEZONE}
    ports:
      - "${CORE_SERVICES_VM_IP_VAR}:2283:2283" # só na LAN: URL local do app do celular em casa (sem o limite de 100 MB do túnel)
    depends_on:
      immich_redis:
        condition: service_healthy
      immich_db:
        condition: service_healthy
    healthcheck:
      disable: false
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: "Host(`fotos.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.immich.entrypoints: "websecure"
      traefik.http.routers.immich.tls.certresolver: "letsencrypt"
      # Sem authelia-forwardauth: o login é o OIDC do Authelia, que os apps de celular também usam.
      traefik.http.services.immich-svc.loadbalancer.server.port: "2283"

  immich_ml:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich_ml
    restart: unless-stopped
    networks:
      - internal_services
    volumes:
      - "${PHOTOS_STACK_MODEL_CACHE_PATH}:/cache" # disco local: modelos baixados de novo se perdidos
    environment:
      TZ: ${SYSTEM_TIMEZONE}
    healthcheck:
      disable: false

  immich_redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    restart: unless-stopped
    networks:
      - internal_services
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  immich_db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_db
    restart: unless-stopped
    networks:
      - internal_services
    volumes:
      - "${PHOTOS_STACK_DB_PATH}:/var/lib/postgresql/data" # disco local da VM: o Immich não aceita banco em NFS
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  proxy:
    external: true
  internal_services:
    external: true
