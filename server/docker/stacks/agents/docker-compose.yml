# docker/stacks/agents/docker-compose.yml
# Base dos agentes (página 13), na core-services-vm: hub de MCPs (agentgateway), MCP do Grafana e MCP de
# operações (ops), cada um em par leitura/controle. A rota de leitura do hub só alcança as instâncias *_leitura,
# que nem registram ferramentas de escrita. Variáveis em /opt/portainer_stack_envs/agents.env
# (setup-agents-volumes.yml). Nenhum MCP publica porta: só o hub, e só a rota de controle, no IP da LAN.

x-ops-env: &ops-env
  TZ: ${SYSTEM_TIMEZONE}
  HOME: /tmp
  PORTAINER_URL: http://portainer:9000
  PORTAINER_API_KEY: ${PORTAINER_API_KEY}
  OPS_ENDPOINTS: ${OPS_ENDPOINTS}
  OPS_CONTAINERS_PROTEGIDOS: ${OPS_CONTAINERS_PROTEGIDOS}
  OPS_STACKS_PROTEGIDAS: ${OPS_STACKS_PROTEGIDAS}
  OPS_PLAYBOOKS: ${OPS_PLAYBOOKS}
  NOTIFICACOES_WEBHOOK_URL: http://n8n:5678/webhook/notificar
  NOTIFICACOES_WEBHOOK_TOKEN: ${NOTIFICACOES_WEBHOOK_TOKEN}
  OPS_TOKEN: ${AGENTS_TOKEN_BACKENDS} # só o hub chama (as redes proxy/agents_internal são compartilhadas)

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0 # mesma versão de agentgateway_version (group_vars)
    container_name: agentgateway
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    command: ["-f", "/config/config.yaml"]
    environment:
      TZ: ${SYSTEM_TIMEZONE}
      # Rastreio no Langfuse (OTLP): o cabeçalho fica fora do config, que não tem segredos.
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: "Authorization=Basic ${LANGFUSE_OTEL_AUTH}"
      OTEL_SERVICE_NAME: agentgateway
    volumes:
      - ${AGENTGATEWAY_CONFIG_PATH}:/config/config.yaml:ro
      - ${AGENTGATEWAY_DATA_PATH}/segredos:/segredos:ro # tokens do Home Assistant e do n8n (0400)
    ports:
      # Só a rota de controle, só no IP da LAN (Docker não passa pelo UFW; a proteção é o bind + a chave).
      # A rota de leitura (4000) e as métricas (15020) ficam na rede interna.
      - "${CORE_SERVICES_VM_IP_VAR}:4100:4100"
    networks:
      - agents_internal
      - proxy # Home Assistant, n8n e o Prometheus

  mcp_auth_servidor:
    image: ghcr.io/sigbit/mcp-auth-proxy:v2.10.2
    container_name: mcp_auth_servidor
    restart: unless-stopped
    command: ["http://agentgateway:4000/mcp"] # rota de leitura do hub
    volumes:
      - ${MCP_AUTH_SERVIDOR_DATA_PATH}:/data # estado OAuth (regerável: perder = novo login)
    extra_hosts: # login OIDC pela LAN: descoberta e troca de código com o Authelia via Traefik na core
      - "auth.${BASE_DOMAIN_FROM_VAULT}:${CORE_SERVICES_VM_IP_VAR}"
    environment:
      TZ: ${SYSTEM_TIMEZONE}
      EXTERNAL_URL: https://servidor.${BASE_DOMAIN_FROM_VAULT}
      NO_AUTO_TLS: "true" # o TLS fica no Traefik
      LISTEN: ":80"
      DATA_PATH: /data
      OIDC_CONFIGURATION_URL: https://auth.${BASE_DOMAIN_FROM_VAULT}/.well-known/openid-configuration
      OIDC_CLIENT_ID: mcp
      OIDC_CLIENT_SECRET: ${MCP_OIDC_CLIENT_SECRET}
      OIDC_SCOPES: openid,profile,email,groups
      OIDC_ALLOWED_ATTRIBUTES: /groups=admins
      AUTH_HMAC_SECRET: ${MCP_AUTH_HMAC_SECRET}
      TRUSTED_PROXIES: 172.16.0.0/12 # o Traefik, na rede proxy
      PROXY_BEARER_TOKEN: ${AGENTS_TOKEN_PROXY} # token interno: só ele abre a rota de leitura do hub
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.servidor.rule: "Host(`servidor.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.servidor.entrypoints: "websecure"
      traefik.http.routers.servidor.tls.certresolver: "letsencrypt"
      traefik.http.routers.servidor.service: "servidor-svc"
      traefik.http.services.servidor-svc.loadbalancer.server.port: "80"
      # Sem forward-auth: o próprio proxy faz o OAuth (o claude.ai não passa pelo Authelia). Bypass na página 05.
    networks:
      - agents_internal
      - proxy

  mcp_grafana_leitura:
    image: grafana/mcp-grafana:2.1.1
    container_name: mcp_grafana_leitura
    restart: unless-stopped
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "mcp_grafana_leitura:8000",
              "--disable-write"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SA_TOKEN_LEITURA} # service account com papel Viewer
      MCP_GRAFANA_SERVER_TOKEN: ${AGENTS_TOKEN_BACKENDS} # só o hub chama (redes compartilhadas)
    networks:
      - agents_internal
      - internal_services

  mcp_grafana_controle:
    image: grafana/mcp-grafana:2.1.1
    container_name: mcp_grafana_controle
    restart: unless-stopped
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000", "--allowed-hosts", "mcp_grafana_controle:8000"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SA_TOKEN_CONTROLE} # service account com papel Editor
      MCP_GRAFANA_SERVER_TOKEN: ${AGENTS_TOKEN_BACKENDS} # só o hub chama (redes compartilhadas)
    networks:
      - agents_internal
      - internal_services

  ops_leitura:
    image: ${OPS_IMAGE}
    pull_policy: never
    container_name: ops_leitura
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    labels:
      diun.enable: "false"
    environment:
      <<: *ops-env
      OPS_MODO: leitura # só ferramentas de consulta; sem chave SSH, vault nem repositório montados
    networks:
      - agents_internal
      - proxy # Portainer (portainer:9000) e o webhook do n8n

  ops_controle:
    image: ${OPS_IMAGE}
    pull_policy: never
    container_name: ops_controle
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    labels:
      diun.enable: "false"
    environment:
      <<: *ops-env
      OPS_MODO: controle
      OPS_REPO_DIR: /repo
      OPS_INVENTARIO: inventories/home/hosts.ini
      OPS_CHAVE_SSH: /segredos/id_ed25519
      ANSIBLE_VAULT_PASSWORD_FILE: /segredos/vault_pass
    volumes:
      - ${OPS_DATA_PATH}/segredos:/segredos:ro
      - ${OPS_DATA_PATH}/repo:/repo
    networks:
      - agents_internal
      - proxy

networks:
  agents_internal:
    name: agents_internal
  proxy:
    external: true
  internal_services:
    external: true
