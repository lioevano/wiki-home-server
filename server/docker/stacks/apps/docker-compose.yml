# docker/stacks/apps/docker-compose.yml
# Aplicações: monitoramento e automação (mídia em docker/stacks/media; fotos e arquivos em docker/stacks/photos e cloud)
# Roda na core-services-vm
version: '3.9'

networks:
  proxy:
    name: proxy
    external: true
  internal_services:
    name: internal_services
    external: true

services:
  # ===================== MONITORAMENTO =====================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - proxy
      - internal_services
    volumes:
      - "${MONITORING_PROMETHEUS_DATA_PATH}:/prometheus"
      - "${MONITORING_PROMETHEUS_CONFIG_PATH}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.listen-address=:9090'
      - '--web.enable-remote-write-receiver' # Recebe as métricas enviadas pelos Alloys (remote_write)
    ports:
      - "${CORE_SERVICES_VM_IP_VAR}:9090:9090" # Remote write dos Alloys (host Proxmox e VMs); só na LAN, sem rota no Traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: "Host(`prometheus.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.prometheus.entrypoints: "websecure"
      traefik.http.routers.prometheus.tls.certresolver: "letsencrypt"
      traefik.http.routers.prometheus.middlewares: "authelia-forwardauth@docker"
      traefik.http.services.prometheus-svc.loadbalancer.server.port: "9090"

  grafana_db:
    image: postgres:15-alpine
    container_name: grafana_db
    restart: unless-stopped
    volumes:
      - "${MONITORING_GRAFANA_DB_PATH}:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=${GRAFANA_DB_PASSWORD_FROM_PORTAINER_ENV}
      - TZ=${SYSTEM_TIMEZONE}
    networks:
      - internal_services
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    user: "${DOCKER_PUID}:${DOCKER_PGID}"
    networks:
      - proxy
      - internal_services
    volumes:
      - "${MONITORING_GRAFANA_DATA_PATH}:/var/lib/grafana"
      - "${MONITORING_GRAFANA_PROVISIONING_PATH}:/etc/grafana/provisioning:ro" # datasources e dashboards gerados pelo Ansible
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_INITIAL_PASSWORD_FROM_PORTAINER_ENV}
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana_db
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD_FROM_PORTAINER_ENV}
      - GF_DATABASE_SSL_MODE=disable
      # Interpolados pelo provisioning de alertas (contact-points.yml)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NOTIFICACOES_WEBHOOK_TOKEN=${NOTIFICACOES_WEBHOOK_TOKEN}
      - TZ=${SYSTEM_TIMEZONE}
    depends_on:
      grafana_db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`grafana.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.grafana.entrypoints: "websecure"
      traefik.http.routers.grafana.tls.certresolver: "letsencrypt"
      traefik.http.routers.grafana.middlewares: "authelia-forwardauth@docker"
      traefik.http.services.grafana-svc.loadbalancer.server.port: "3000"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - internal_services
    ports:
      - "${CORE_SERVICES_VM_IP_VAR}:3100:3100" # Recebe logs dos Alloys (host Proxmox e VMs); só na LAN, sem rota no Traefik
    volumes:
      - "${MONITORING_LOKI_CONFIG_PATH}/loki-local-config.yaml:/etc/loki/config.yaml:ro"
      - "${MONITORING_LOKI_DATA_PATH}:/loki"
    command: -config.file=/etc/loki/config.yaml

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    networks:
      - internal_services
      - proxy # alcança as aplicações pelas URLs internas
    volumes:
      - "${MONITORING_BLACKBOX_CONFIG_PATH}/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${MONITORING_DIUN_DATA_PATH}:/data"
    environment:
      # Integração notificacoes (NTF-2): avisa quando sai imagem nova de qualquer container desta VM
      - TZ=${SYSTEM_TIMEZONE}
      - DIUN_WATCH_SCHEDULE=0 9 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_WEBHOOK_ENDPOINT=http://n8n:5678/webhook/notificar
      - DIUN_NOTIF_WEBHOOK_METHOD=POST
      - DIUN_NOTIF_WEBHOOK_HEADERS_AUTHORIZATION=Bearer ${NOTIFICACOES_WEBHOOK_TOKEN}
      - DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE=application/json

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - internal_services
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      # Só leitura: a Homepage lista containers; nada de POST, exec, imagens ou volumes
      - CONTAINERS=1
      - POST=0

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
      - internal_services
    volumes:
      - "${MONITORING_HOMEPAGE_CONFIG_PATH}:/app/config"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${BASE_DOMAIN_FROM_VAULT},homepage:3000 # homepage:3000 = teste de disponibilidade interno
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      # Credenciais dos widgets (integração painel, PNL-2); usadas como placeholders no services.yaml
      - HOMEPAGE_VAR_JELLYFIN_KEY=${HOMEPAGE_VAR_JELLYFIN_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_KEY}
      - HOMEPAGE_VAR_LIDARR_KEY=${HOMEPAGE_VAR_LIDARR_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY}
      - HOMEPAGE_VAR_SEERR_KEY=${HOMEPAGE_VAR_SEERR_KEY}
      - HOMEPAGE_VAR_NEXTCLOUD_KEY=${HOMEPAGE_VAR_NEXTCLOUD_KEY}
      - HOMEPAGE_VAR_HOMEASSISTANT_KEY=${HOMEPAGE_VAR_HOMEASSISTANT_KEY}
      - HOMEPAGE_VAR_PORTAINER_KEY=${HOMEPAGE_VAR_PORTAINER_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_USER=${HOMEPAGE_VAR_QBITTORRENT_USER}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_GRAFANA_PASSWORD=${HOMEPAGE_VAR_GRAFANA_PASSWORD}
    depends_on:
      - docker-socket-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: "Host(`home.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.homepage.entrypoints: "websecure"
      traefik.http.routers.homepage.tls.certresolver: "letsencrypt"
      traefik.http.routers.homepage.middlewares: "authelia-forwardauth@docker"
      traefik.http.services.homepage-svc.loadbalancer.server.port: "3000"

  # ===================== AUTOMAÇÃO =====================

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_app
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - "${N8N_CONFIG_PATH}:/home/node/.n8n"
    environment:
      - N8N_HOST=${N8N_SUBDOMAIN}.${BASE_DOMAIN_FROM_VAULT}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN}.${BASE_DOMAIN_FROM_VAULT}/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${SYSTEM_TIMEZONE}
      # Workflow "notificar": lê o bot do Telegram e o token do webhook do ambiente ($env)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NOTIFICACOES_WEBHOOK_TOKEN=${NOTIFICACOES_WEBHOOK_TOKEN}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.n8n.rule: 'Host(`${N8N_SUBDOMAIN}.${BASE_DOMAIN_FROM_VAULT}`)'
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: letsencrypt
      traefik.http.routers.n8n.middlewares: authelia-forwardauth@docker
      traefik.http.services.n8n.loadbalancer.server.port: '5678'

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: homeassistant
    restart: unless-stopped
    volumes:
      - "${AUTO_STACK_HOMEASSISTANT_CONFIG_PATH}:/config"
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      - proxy
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - TZ=${SYSTEM_TIMEZONE}
    labels:
      traefik.enable: "true"
      traefik.http.routers.homeassistant.rule: "Host(`hass.${BASE_DOMAIN_FROM_VAULT}`)"
      traefik.http.routers.homeassistant.entrypoints: "websecure"
      traefik.http.routers.homeassistant.tls.certresolver: "letsencrypt"
      traefik.http.routers.homeassistant.middlewares: "authelia-forwardauth@docker"
      traefik.http.services.homeassistant-svc.loadbalancer.server.port: "8123"
