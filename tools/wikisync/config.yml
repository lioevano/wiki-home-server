# Configuração do wikisync (tools/wikisync). Caminhos relativos à raiz do repo,
# exceto ignore_paths/ignore_orphans, relativos a server/.
wiki_dir: wiki
server_dir: server

# Blocos com title="<caminho>" iniciado por uma destas pastas são verdade literal.
server_roots: [ansible, docker, scripts]

# Placeholders didáticos citados na wiki (não são arquivos reais).
ignore_paths:
  - "docker/stacks/novoservico/**"
  - "docker/stacks/NOME_DA_STACK/**"
  - "docker/stacks/nome_da_stack/**"
  - "ansible/roles/NOME_DO_ROLE/**"
  - "ansible/playbooks/meu_playbook_modificado.yml"
  - "ansible/roles/meu_role_modificado/**"
  # Exemplos didáticos do guia "Adicionando novo serviço Docker".
  - "ansible/playbooks/setup-novoservico-volumes.yml"
  - "ansible/playbooks/setup-filebrowser-volumes.yml"
  - "docker/stacks/filebrowser/**"
  # .env reais: existem só em tempo de execução e nunca são versionados.
  - "docker/stacks/.env"
  - "docker/stacks/*/.env"

# Arquivos do server conscientemente não documentados: caminho -> motivo.
ignore_orphans:
  AGENTS.md: contexto para agentes de IA da pasta server/ (não é infraestrutura)
  CLAUDE.md: contexto do Claude para a pasta server/ (não é infraestrutura)

# Pastas ignoradas nas varreduras do repositório.
exclude_dirs: [.git, .venv, venv, wiki/venv, wiki/site, site, __pycache__, .pytest_cache, node_modules, .superpowers, .ansible, .vscode, .idea]
