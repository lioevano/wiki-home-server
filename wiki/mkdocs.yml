site_name: Wiki do Servidor do Léo Ivan
site_url: https://wiki.lioevano.com/
site_author: Léo Ivan
site_description: >-
  Guia completo para implementação e manutenção de um servidor doméstico
  otimizado, utilizando Proxmox, Ansible, Docker, ZFS e Cloudflare.

repo_name: 'lioevano/wiki-home-server'
repo_url: 'https://github.com/lioevano/wiki-home-server/'
edit_uri: 'edit/main/wiki/docs/'

theme:
  name: material
  language: 'pt'
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: 'blue'
      accent: 'indigo'
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: 'blue'
      accent: 'indigo'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox
  - mermaid2
  - git-revision-date-localized:
      timezone: "America/Sao_Paulo"
      custom_format: "%d/%m/%Y"
      fallback_to_build_date: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.extra
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
      # Mantém acentos nas âncoras (#instalação-...), como os links da wiki são escritos.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list

