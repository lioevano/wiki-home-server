# mkdocs.yml
site_name: Meu Guia de Servidor Doméstico
site_url: https://lioevano.github.io/wiki-home-server/  # Ou seu domínio customizado
site_author: Seu Nome
site_description: >-
  Guia completo para implementação e manutenção de um servidor doméstico
  otimizado, utilizando Proxmox, Ansible, Docker, ZFS e Cloudflare.

repo_name: 'lioevano/wiki-home-server' # Opcional: Link para o repo Git
repo_url: 'https://github.com/lioevano/wiki-home-server/' # Opcional
edit_uri: 'edit/main/wiki-home-server/docs/' # Opcional: Link para editar página no GitHub

theme:
  name: material
  language: 'pt' # Ou 'en' se preferir
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: 'blue'
      accent: 'indigo'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: 'blue'
      accent: 'indigo'
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking # URL atualiza com a seção visível
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # - awesome-pages # Para gerar navegação a partir da estrutura de diretórios (alternativa ao nav manual)
  # - tags # Se quiser adicionar tags às páginas
  - glightbox # Para visualização de imagens
  - mermaid2 # Para diagramas (muito útil para a Visão Geral da Arquitetura)
  - git-revision-date-localized

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets # Para incluir trechos de arquivos (útil para código Ansible/Docker)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details # Para blocos expansíveis
  - pymdownx.tabbed:
      alternate_style: true
  - admonition # Blocos de notas, avisos, etc.
  - toc:
      permalink: true # Adiciona links âncora aos cabeçalhos
      toc_depth: 3 # Profundidade do sumário na lateral
  - attr_list # Para adicionar atributos a elementos (ex: classes CSS)

# Navegação (muito importante para a estrutura)
# Se usar o plugin awesome-pages, você pode omitir/simplificar esta seção.
# Mas o controle manual dá mais flexibilidade na ordem e nos títulos.
