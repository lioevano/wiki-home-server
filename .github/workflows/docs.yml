name: docs

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o plugin git-revision-date-localized precisa do histórico

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambiente
        run: python tools/dev.py setup

      # O FastMCP do ops fica fora do requirements-dev (incharia a imagem do sysadmin); o teste do cabeçalho do hub
      # precisa dele na versão fixada (ops_fastmcp_version) para rodar em vez de pular.
      - name: FastMCP do ops (versão do group_vars)
        run: |
          v=$(sed -n 's/^ops_fastmcp_version: *"\([0-9][0-9.]*\)".*/\1/p' server/ansible/inventories/home/group_vars/all/main.yml)
          test -n "$v"
          .venv/bin/python -m pip install --quiet "fastmcp==$v"

      - name: Testes do wikisync
        run: python tools/dev.py test

      - name: Coerência wiki <-> server
        run: python tools/dev.py check

      - name: Build estrito da wiki
        run: python tools/dev.py build

      # Mermaid 11 (o que o Material carrega) numa coluna da largura do artigo: falha com diagrama quebrado ou pequeno
      # demais. O runner já traz o Node e o Google Chrome.
      - name: Diagramas
        run: python tools/dev.py diagramas

      - name: Publicar no GitHub Pages (branch gh-pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .venv/bin/mkdocs gh-deploy --force -f wiki/mkdocs.yml
